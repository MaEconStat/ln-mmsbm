[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ln-mmsbm"
version = "0.1.0"
description = "Lognormal mixture multilayer block model with a TWIST-inspired rectangular tensor spectral algorithm"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Research implementation" }]
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "scipy>=1.10"]
keywords = ["multilayer networks", "lognormal", "stochastic block model", "tensor decomposition"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
